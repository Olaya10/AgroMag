server.port=8083
spring.application.name=report-service

# Feign and Circuit Breaker
spring.cloud.openfeign.circuitbreaker.enabled=true
feign.client.config.default.connectTimeout=10000
feign.client.config.default.readTimeout=60000
resilience4j.timelimiter.instances.finca-service.timeoutDuration=60s

# Service URLs (for local testing without Eureka)
finca-service.url=http://localhost:8081
inventory-service.url=http://localhost:8082

# Discovery (Eureka)
# eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Max request sizes
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
